name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  containment:
    name: Harmful-content containment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Fail if benchmark data, eval logs or results are tracked
        run: |
          tracked=$(git ls-files | grep -E '^(data|results)/|(^|/)harmful/|_behaviors_.*\.json$|chat_(validation|.*_test)\.json$|\.eval$' || true)
          if [ -n "$tracked" ]; then
            echo "These files must never be committed:"
            echo "$tracked"
            exit 1
          fi

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes full version tags only, no moving major tag.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Pango for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: uv sync --locked --extra pdf
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - name: Fail if the dashboard API schema is stale
        run: uv run python scripts/api_schema.py | diff - frontend/src/api/schema.json
      - run: uv build

  frontend:
    name: Dashboard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Fail if the generated API types are stale
        run: npm run gen:types && git diff --exit-code src/api/types.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
