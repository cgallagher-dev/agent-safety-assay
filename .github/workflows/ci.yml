name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  containment:
    name: Harmful-content containment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Fail if benchmark data, eval logs or results are tracked
        run: |
          tracked=$(git ls-files | grep -E '^(data|results)/|(^|/)harmful/|_behaviors_.*\.json$|chat_(validation|.*_test)\.json$|\.eval$' || true)
          if [ -n "$tracked" ]; then
            echo "These files must never be committed:"
            echo "$tracked"
            exit 1
          fi

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes full version tags only, no moving major tag.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - run: uv build
